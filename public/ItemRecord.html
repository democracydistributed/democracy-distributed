<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiGov — Item Record</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #f8fafc; }
    .font-serif { font-family: Georgia, 'Times New Roman', serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    /* ══════════════════════════════════════════════════════════════════════
       MOCK DATA — field names mirror Corteza module field handles
       TODO:LIVE[A] — replace getItem() with fetch to:
         POST /api/integration-gateway/entry/wikigov-item-record
         body: { filter: { itemId: id },
                 include: ["votes","budgetAllocation","outcome","projects",
                           "procurement","lawChanges","selectedSuggestions",
                           "meetingDiscussedIn","chart"] }
    ══════════════════════════════════════════════════════════════════════ */

    const MOCK_ITEMS = {

      /* (A) Flagship: fully traced — developer paid → garden authorized → built */
      "item-a": {
        itemId:       "item-a",
        subject:      "Section 37 Community Benefit Contribution — 2847 Queen Street East Condominiums",
        organization: { name: "Toronto City Council", url: "#" },
        jurisdiction: "City of Toronto, ON",
        date:         "2024-03-18",
        itemNumber:   "PH4.3",
        sourceUrl:    "#",
        status:       "Passed",
        plainSummary: "A condo developer paid $1.2M into a city fund as the price of building taller. Council voted to spend the money on a new community garden in Leslieville — and the garden opened in September 2025.",
        pendingContext: null,
        score: { upvotes: 47, downvotes: 3 },

        _chainStates: {
          money: "traced", decision: "traced", outcome: "traced",
          projects: "traced", procurement: "traced", lawChanges: "not_applicable",
        },

        decisionText: "City Council authorized the Director of Community Planning to enter into a Section 37 Agreement with 2847 Queen East Holdings Inc., securing a cash contribution of $1,200,000 directed to the Leslieville Neighbourhood Improvement Fund for community garden construction and programming.",
        votes: [
          { councillor: "Paula Fletcher",  ward: "Ward 14", vote: "yes" },
          { councillor: "Brad Bradford",   ward: "Ward 19", vote: "yes" },
          { councillor: "Shelley Carroll", ward: "Ward 17", vote: "yes" },
          { councillor: "Nick Mantas",     ward: "Ward 21", vote: "no"  },
          { councillor: "James Pasternak", ward: "Ward 6",  vote: "no"  },
        ],
        votesSummary: { yes: 22, no: 3, absent: 1 },

        budgetAllocation: [{
          allocationId: "ba-001",
          description: "Section 37 Contribution — Leslieville Community Garden",
          fundingSource: "Developer Contribution (Section 37 Agreement)",
          amount: 1200000, currency: "CAD", year: 2024, actualSpent: 1148000,
          status: "Disbursed", sourceUrl: "#",
        }],

        outcome: [{
          outcomeId: "oc-001",
          description: "Greenway Community Garden opened at 2901 Queen Street East on September 12, 2025. 42 raised-bed plots were allocated by lottery to Leslieville residents. The garden is operated year-round by Leslieville Eats, a local food-security nonprofit. Wheelchair-accessible plots were prioritized per a community suggestion adopted by council.",
          date: "2025-09-12", status: "Completed",
          evidenceUrl: "#", evidenceType: "City of Toronto press release",
        }],

        projects: [{
          projectId: "proj-001", name: "Greenway Community Garden — Queen East",
          phase: "Completed", startDate: "2024-07", endDate: "2025-09",
          budget: 1148000, lead: "Toronto Parks & Recreation", sourceUrl: "#",
        }],

        procurement: [
          { contractId: "CT-2024-4421", vendor: "Urban Green Spaces Inc.", value: 890000,
            description: "Design and construction of community garden facility",
            awardDate: "2024-09-15", sourceUrl: "#" },
          { contractId: "CT-2024-4422", vendor: "Leslieville Eats Society", value: 258000,
            description: "3-year garden operations and community programming",
            awardDate: "2024-10-02", sourceUrl: "#" },
        ],

        lawChanges: [],

        selectedSuggestions: [{
          suggestionId: "sug-001",
          text: "Prioritize wheelchair-accessible plots in the garden allocation",
          author: "Disability Rights Toronto", status: "Incorporated",
        }],

        meetingDiscussedIn: [
          { meetingId: "mtg-ph-042", committee: "Planning & Housing Committee", date: "2024-03-06", agendaUrl: "#" },
          { meetingId: "mtg-cc-015", committee: "Toronto City Council",         date: "2024-03-18", agendaUrl: "#" },
        ],

        provenance: [
          { label: "Source document",      url: "#", text: "City of Toronto Staff Report PH4.3 (PDF)" },
          { label: "Section 37 Agreement", url: "#", text: "2847 Queen East S.37 Agreement (PDF)" },
          { label: "Contributed by",  author: "WikiGov volunteer", date: null },
          { label: "Last verified",   author: null, date: "2025-10-01" },
        ],
      },

      /* (B) Typical sparse: subject + org + decision only */
      "item-b": {
        itemId:       "item-b",
        subject:      "Zoning Amendment to Permit Backyard Hens in Residential (R1/R2) Zones",
        organization: { name: "Hamilton City Council", url: "#" },
        jurisdiction: "City of Hamilton, ON",
        date:         "2025-01-22",
        itemNumber:   "CM25-001",
        sourceUrl:    "#",
        status:       "Passed",
        plainSummary: "Hamilton voted 9–6 to let residents in low-density neighbourhoods keep up to four egg-laying hens in their backyards, ending a ban in place since the 1960s.",
        pendingContext: null,
        score: { upvotes: 12, downvotes: 8 },

        _chainStates: {
          money: "not_yet_traced", decision: "traced", outcome: "not_yet_traced",
          projects: "not_yet_traced", procurement: "not_applicable", lawChanges: "not_yet_traced",
        },

        decisionText: "Council approved an amendment to Zoning By-law No. 6593 permitting the keeping of up to four female chickens (hens) on lots in R1, R1A, R2, and R2A zones with a minimum area of 325 m², subject to a 3 m setback for coops from any property line and a prohibition on roosters.",
        votes: [
          { councillor: "Maureen Wilson",    ward: "Ward 1", vote: "yes" },
          { councillor: "Cameron Kroetsch", ward: "Ward 2", vote: "yes" },
          { councillor: "Nrinder Nann",     ward: "Ward 3", vote: "yes" },
          { councillor: "Esther Pauls",     ward: "Ward 4", vote: "no"  },
          { councillor: "Matt Francis",     ward: "Ward 5", vote: "no"  },
        ],
        votesSummary: { yes: 9, no: 6, absent: 0 },

        budgetAllocation: [], outcome: [], projects: [], procurement: [],
        lawChanges: [], selectedSuggestions: [],

        meetingDiscussedIn: [
          { meetingId: "mtg-cm-001", committee: "Hamilton City Council", date: "2025-01-22", agendaUrl: "#" },
        ],

        provenance: [
          { label: "Source document", url: "#", text: "Hamilton Council Agenda CM25-001" },
          { label: "Contributed by",  author: "WikiGov volunteer", date: null },
        ],
      },

      /* (C) Recent decision: money + decision traced, outcome pending */
      "item-c": {
        itemId:       "item-c",
        subject:      "O-Train Line 2 Extension — $84M Infrastructure Reserve Fund Allocation",
        organization: { name: "Ottawa City Council", url: "#" },
        jurisdiction: "City of Ottawa, ON",
        date:         "2025-11-03",
        itemNumber:   "ACS2025-PWE-GEN-0014",
        sourceUrl:    "#",
        status:       "Passed",
        plainSummary: "Ottawa committed $84 million from its capital reserve to extend the Trillium light-rail line south to Bowesville. Tenders haven't gone out yet and the line isn't expected to open until late 2029.",
        pendingContext: "Construction expected to begin mid-2026. Estimated line opening: late 2029. Check back once tenders are awarded.",
        score: { upvotes: 31, downvotes: 9 },

        _chainStates: {
          money: "traced", decision: "traced", outcome: "pending",
          projects: "traced", procurement: "not_yet_traced", lawChanges: "not_applicable",
        },

        decisionText: "Council authorized a transfer of $84,000,000 from the City Infrastructure Reserve Fund to the Transit Capital Program for the O-Train Line 2 Southern Extension to Bowesville Station, conditional on confirmation of Provincial co-funding by March 31, 2026.",
        votes: [
          { councillor: "Mark Sutcliffe",   ward: "Mayor",  vote: "yes" },
          { councillor: "Laura Dudas",      ward: "Ward 2", vote: "yes" },
          { councillor: "Stéphanie Plante", ward: "Ward 3", vote: "yes" },
          { councillor: "David Brown",      ward: "Ward 4", vote: "no"  },
          { councillor: "Glen Gower",       ward: "Ward 6", vote: "yes" },
        ],
        votesSummary: { yes: 18, no: 5, absent: 1 },

        budgetAllocation: [{
          allocationId: "ba-002",
          description: "O-Train Line 2 Extension — Reserve Transfer to Transit Capital",
          fundingSource: "City of Ottawa Infrastructure Reserve Fund",
          amount: 84000000, currency: "CAD", year: 2025, actualSpent: null,
          status: "Approved — not yet disbursed", sourceUrl: "#",
        }],

        outcome: [],

        projects: [{
          projectId: "proj-002", name: "O-Train Line 2 Extension to Bowesville",
          phase: "Pre-construction / Design", startDate: "2026-06", endDate: "2029-12",
          budget: 84000000, lead: "OC Transpo / City of Ottawa", sourceUrl: "#",
        }],

        procurement: [], lawChanges: [], selectedSuggestions: [],

        meetingDiscussedIn: [
          { meetingId: "mtg-oc-088", committee: "Ottawa City Council", date: "2025-11-03", agendaUrl: "#" },
        ],

        provenance: [
          { label: "Source document", url: "#", text: "Ottawa City Council Report ACS2025-PWE-GEN-0014" },
          { label: "Contributed by",  author: "WikiGov team", date: null },
          { label: "Last verified",   author: null, date: "2025-11-05" },
        ],
      },
    };

    /* TODO:LIVE[B]: Replace with API-driven list */
    const ITEM_LIST = [
      { id: "item-a", badge: "Flagship", label: "Toronto Section 37 — fully traced"     },
      { id: "item-b", badge: "Typical",  label: "Hamilton backyard hens — sparse"       },
      { id: "item-c", badge: "Recent",   label: "Ottawa transit $84M — outcome pending" },
    ];

    /* ── Data access layer ─────────────────────────────────────────────────
       TODO:LIVE[A]: Replace body with async fetch to Corteza Integration Gateway.
    ─────────────────────────────────────────────────────────────────────── */
    function getItem(id) {
      return MOCK_ITEMS[id] ?? null;
    }

    /* ── Helpers ─────────────────────────────────────────────────────────── */
    const cadFmt = new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD", maximumFractionDigits: 0 });
    function fmtMoney(n) { return cadFmt.format(n); }
    function fmtDate(d) {
      if (!d) return "";
      const iso = d.length === 7 ? d + "-01" : d;
      return new Date(iso + "T12:00:00").toLocaleDateString("en-CA", {
        year: "numeric", month: "long", day: d.length === 7 ? undefined : "numeric"
      });
    }

    /* ══════════════════════════════════════════════════════════════════════
       UI ATOMS
    ══════════════════════════════════════════════════════════════════════ */

    function ExtLink({ href, children, cls = "" }) {
      return (
        <a href={href} target="_blank" rel="noopener noreferrer"
           className={`text-blue-700 underline underline-offset-2 hover:text-blue-900 transition-colors ${cls}`}>
          {children}
        </a>
      );
    }

    function Chip({ children, color = "slate" }) {
      const map = {
        slate: "bg-slate-100 text-slate-600",
        green: "bg-green-50 text-green-800 ring-1 ring-green-200",
        amber: "bg-amber-50 text-amber-800 ring-1 ring-amber-200",
        rose:  "bg-rose-50 text-rose-700",
      };
      return (
        <span className={`inline-block text-xs font-medium px-2 py-0.5 rounded ${map[color]}`}>
          {children}
        </span>
      );
    }

    function Label({ children }) {
      return (
        <p className="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-3">
          {children}
        </p>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       CHAIN SECTION WRAPPER
       state: "traced" | "not_yet_traced" | "not_applicable" | "pending"
    ══════════════════════════════════════════════════════════════════════ */

    function ChainSection({ sectionRef, state, label, pendingContext, children }) {
      if (state === "not_applicable") {
        return (
          <div ref={sectionRef} className="my-10 border-l-2 border-slate-200 pl-5">
            <Label>{label}</Label>
            <p className="text-sm text-slate-400 italic">Not applicable for this item type.</p>
          </div>
        );
      }
      if (state === "not_yet_traced") {
        return (
          <div ref={sectionRef} className="my-10 border-l-2 border-dashed border-slate-300 pl-5">
            <Label>{label}</Label>
            <p className="text-slate-500 text-sm mb-3 leading-relaxed">
              Not yet traced. The underlying data likely exists in public records but hasn't been connected here yet.
            </p>
            {/* TODO:LIVE[C]: wire onClick to contribution intake endpoint */}
            <button className="text-sm border border-slate-400 text-slate-600 rounded px-3 py-1.5 hover:bg-slate-100 transition-colors cursor-pointer">
              Help trace this →
            </button>
          </div>
        );
      }
      if (state === "pending") {
        return (
          <div ref={sectionRef} className="my-10 border-l-2 border-amber-300 pl-5">
            <Label>{label}</Label>
            <p className="text-slate-700 text-sm mb-1">
              <span className="font-semibold">Outcome pending.</span> This decision is too recent to have a documented outcome — not a data gap.
            </p>
            {pendingContext && <p className="text-slate-500 text-sm mt-1">{pendingContext}</p>}
          </div>
        );
      }
      return (
        <div ref={sectionRef} className="my-10 border-l-2 border-slate-800 pl-5">
          <Label>{label}</Label>
          {children}
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       CHAIN RIBBON
    ══════════════════════════════════════════════════════════════════════ */

    const PRIMARY_LINKS = [
      { key: "money",    icon: "$",  label: "Money",    title: "Was public money involved?" },
      { key: "decision", icon: "⚖", label: "Decision", title: "What was decided?"          },
      { key: "outcome",  icon: "◉", label: "Outcome",  title: "What happened after?"       },
    ];

    const SECONDARY_LINKS = [
      { key: "projects",    label: "Projects"    },
      { key: "procurement", label: "Procurement" },
      { key: "lawChanges",  label: "Law changes" },
    ];

    function PrimaryPill({ cfg, state, onNav }) {
      const live = state === "traced";
      const styles = {
        traced:         "bg-slate-900 text-white border-slate-900 cursor-pointer hover:bg-slate-700",
        not_yet_traced: "bg-white text-slate-400 border-slate-300 border-dashed cursor-default",
        not_applicable: "bg-white text-slate-300 border-slate-100 cursor-default",
        pending:        "bg-amber-50 text-amber-700 border-amber-300 cursor-default",
      }[state];
      const sub = { traced: null, not_yet_traced: "Not yet traced", not_applicable: "N/A", pending: "Outcome pending" }[state];

      return (
        <button className={`flex flex-col items-center border rounded px-4 py-2 min-w-[76px] transition-all select-none ${styles}`}
                onClick={() => live && onNav(cfg.key)} title={cfg.title} disabled={!live}>
          <span className="text-base leading-none mb-0.5">{cfg.icon}</span>
          <span className="text-xs font-semibold">{cfg.label}</span>
          {sub && <span className="text-[10px] opacity-70 mt-0.5 leading-tight text-center">{sub}</span>}
        </button>
      );
    }

    function SecondaryPill({ cfg, state, onNav }) {
      const live = state === "traced";
      const na   = state === "not_applicable";
      const cls  = na
        ? "border-slate-100 text-slate-300 cursor-default"
        : live
          ? "border-slate-400 text-slate-600 hover:bg-slate-100 cursor-pointer"
          : "border-dashed border-slate-300 text-slate-400 cursor-default";
      return (
        <button className={`text-xs px-2.5 py-1 rounded border transition-colors ${cls}`}
                onClick={() => live && onNav(cfg.key)} disabled={!live}>
          {cfg.label}{state === "not_yet_traced" && <span className="ml-0.5 opacity-50">?</span>}
        </button>
      );
    }

    function ChainRibbon({ item, onNav }) {
      const s = item._chainStates;
      const teaser = s.outcome === "traced" && item.outcome?.[0]?.description;
      return (
        <div className="my-8 p-5 bg-white border border-slate-200 rounded-xl shadow-sm">
          <Label>Can you trace the full chain for this item?</Label>
          <div className="flex items-center gap-2 flex-wrap mb-4">
            {PRIMARY_LINKS.map((cfg, i) => (
              <div key={cfg.key} className="flex items-center gap-2">
                <PrimaryPill cfg={cfg} state={s[cfg.key]} onNav={onNav} />
                {i < PRIMARY_LINKS.length - 1 && <span className="text-slate-300 text-sm select-none">→</span>}
              </div>
            ))}
          </div>
          {teaser && (
            <p className="text-sm text-slate-600 border-l-2 border-green-400 pl-3 mb-4 italic leading-relaxed cursor-pointer hover:text-slate-800 transition-colors"
               onClick={() => onNav("outcome")}>
              "{teaser.slice(0, 130)}{teaser.length > 130 ? "…" : ""}" ↓
            </p>
          )}
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[11px] uppercase tracking-widest text-slate-400 mr-1">Also:</span>
            {SECONDARY_LINKS.map(cfg => (
              <SecondaryPill key={cfg.key} cfg={cfg} state={s[cfg.key]} onNav={onNav} />
            ))}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       PAGE SECTIONS
    ══════════════════════════════════════════════════════════════════════ */

    function IdentityHeader({ item }) {
      const statusColor = { Passed: "green", Failed: "rose" }[item.status] ?? "slate";
      return (
        <header className="mb-6">
          <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-slate-500 mb-2">
            {item.organization?.url
              ? <ExtLink href={item.organization.url}>{item.organization.name}</ExtLink>
              : <span>{item.organization?.name}</span>}
            {item.jurisdiction && <><span>·</span><span>{item.jurisdiction}</span></>}
            {item.date         && <><span>·</span><span>{fmtDate(item.date)}</span></>}
            {item.itemNumber   && <><span>·</span><ExtLink href={item.sourceUrl ?? "#"}>{item.itemNumber} ↗</ExtLink></>}
            {item.status       && <Chip color={statusColor}>{item.status}</Chip>}
          </div>
          <h1 className="text-2xl font-serif leading-snug text-slate-900">{item.subject}</h1>
        </header>
      );
    }

    function PlainSummary({ item }) {
      if (!item.plainSummary) return null;
      return (
        <div className="mb-6 pl-5 border-l-4 border-slate-800">
          <p className="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-1">Plain language</p>
          <p className="text-slate-800 leading-relaxed">{item.plainSummary}</p>
        </div>
      );
    }

    function DecisionSection({ item }) {
      return (
        <div>
          {item.decisionText && (
            <p className="text-slate-700 text-sm leading-relaxed mb-5">{item.decisionText}</p>
          )}
          {item.votesSummary && (
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Vote breakdown</p>
              <div className="flex gap-5 mb-3 text-sm font-semibold">
                <span className="text-green-700">{item.votesSummary.yes} yes</span>
                <span className="text-rose-600">{item.votesSummary.no} no</span>
                {item.votesSummary.absent > 0 && (
                  <span className="text-slate-400 font-normal">{item.votesSummary.absent} absent</span>
                )}
              </div>
              {item.votes?.length > 0 && (
                <div className="space-y-1.5">
                  {item.votes.map(v => (
                    <div key={v.councillor} className="flex items-center gap-2 text-sm">
                      <span className={`w-2 h-2 rounded-full flex-shrink-0 ${v.vote === "yes" ? "bg-green-500" : "bg-rose-400"}`} />
                      <span className="text-slate-700">{v.councillor}</span>
                      <span className="text-slate-400 text-xs">{v.ward}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function MoneySection({ item }) {
      if (!item.budgetAllocation?.length) return null;
      return (
        <div className="space-y-5">
          {item.budgetAllocation.map(a => {
            const hasActual = a.actualSpent != null;
            const pct = hasActual ? Math.round((a.actualSpent / a.amount) * 100) : 0;
            return (
              <div key={a.allocationId}>
                <p className="font-medium text-slate-800 mb-0.5">{a.description}</p>
                <p className="text-xs text-slate-500 mb-3">{a.fundingSource}</p>
                <div className="flex gap-8 mb-3">
                  <div>
                    <p className="text-xs text-slate-500 mb-0.5">Allocated</p>
                    <p className="text-xl font-semibold text-slate-900 tabular-nums">{fmtMoney(a.amount)}</p>
                  </div>
                  {hasActual && (
                    <div>
                      <p className="text-xs text-slate-500 mb-0.5">Spent</p>
                      <p className="text-xl font-semibold text-green-700 tabular-nums">{fmtMoney(a.actualSpent)}</p>
                    </div>
                  )}
                </div>
                {hasActual && (
                  <div className="mb-3">
                    <div className="h-1.5 bg-slate-100 rounded-full w-48">
                      <div className="h-1.5 bg-green-500 rounded-full" style={{ width: `${pct}%` }} />
                    </div>
                    <p className="text-xs text-slate-400 mt-1">{pct}% of allocation spent</p>
                  </div>
                )}
                <div className="flex items-center gap-3">
                  <Chip color={a.status === "Disbursed" ? "green" : "amber"}>{a.status}</Chip>
                  {a.sourceUrl && <ExtLink href={a.sourceUrl} cls="text-xs">Source ↗</ExtLink>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function OutcomeSection({ item }) {
      if (!item.outcome?.length) return null;
      return (
        <div className="space-y-5">
          {item.outcome.map(o => (
            <div key={o.outcomeId}>
              <p className="text-slate-800 leading-relaxed mb-3">{o.description}</p>
              <div className="flex flex-wrap items-center gap-3">
                <Chip color="green">{o.status}</Chip>
                {o.date && <span className="text-xs text-slate-500">{fmtDate(o.date)}</span>}
                {o.evidenceUrl && <ExtLink href={o.evidenceUrl} cls="text-xs">{o.evidenceType} ↗</ExtLink>}
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       PROGRESSIVE DISCLOSURE
    ══════════════════════════════════════════════════════════════════════ */

    function Accordion({ label, children }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="border-t border-slate-100 first:border-t-0">
          <button className="w-full flex items-center justify-between py-3 text-left text-sm text-slate-600 hover:text-slate-900 transition-colors cursor-pointer"
                  onClick={() => setOpen(o => !o)}>
            <span className="font-medium">{label}</span>
            <span className="text-slate-300 text-xs ml-2">{open ? "▲" : "▼"}</span>
          </button>
          {open && <div className="pb-5">{children}</div>}
        </div>
      );
    }

    function AccordionBody({ state, notTracedLabel, children }) {
      if (state === "not_applicable") return <p className="text-sm text-slate-400 italic">Not applicable for this item type.</p>;
      if (state === "not_yet_traced") return (
        <div>
          <p className="text-sm text-slate-500 mb-3">{notTracedLabel} hasn't been traced yet.</p>
          {/* TODO:LIVE[C]: wire to contribution intake */}
          <button className="text-sm border border-slate-400 text-slate-600 rounded px-3 py-1.5 hover:bg-slate-100 transition-colors cursor-pointer">
            Help trace this →
          </button>
        </div>
      );
      return children;
    }

    function accordionLabel(base, state, count) {
      if (state === "not_applicable") return `${base} — N/A`;
      if (state === "not_yet_traced") return `${base} — not yet traced`;
      if (count != null)              return `${base} (${count})`;
      return base;
    }

    function ProgressiveDisclosure({ item, refs }) {
      const s = item._chainStates;
      return (
        <div className="my-10 border border-slate-100 rounded-xl px-5">
          <p className="text-[11px] font-semibold uppercase tracking-widest text-slate-400 pt-4 pb-2">Supporting detail</p>

          <div ref={refs.projects}>
            <Accordion label={accordionLabel("Projects", s.projects, item.projects?.length)}>
              <AccordionBody state={s.projects} notTracedLabel="Project information">
                {item.projects?.length ? (
                  <div className="space-y-3">
                    {item.projects.map(p => (
                      <div key={p.projectId} className="text-sm border border-slate-100 rounded-lg p-3">
                        <p className="font-medium text-slate-800">{p.name}</p>
                        <p className="text-slate-500 text-xs mt-1">{p.lead} · {p.phase}</p>
                        <p className="text-slate-500 text-xs">{fmtDate(p.startDate)} — {fmtDate(p.endDate)} · {fmtMoney(p.budget)}</p>
                        {p.sourceUrl && <ExtLink href={p.sourceUrl} cls="text-xs mt-1 block">Source ↗</ExtLink>}
                      </div>
                    ))}
                  </div>
                ) : <p className="text-sm text-slate-400 italic">No projects linked.</p>}
              </AccordionBody>
            </Accordion>
          </div>

          <div ref={refs.procurement}>
            <Accordion label={accordionLabel("Procurement", s.procurement, item.procurement?.length)}>
              <AccordionBody state={s.procurement} notTracedLabel="Contract information">
                {item.procurement?.length ? (
                  <div className="space-y-3">
                    {item.procurement.map(c => (
                      <div key={c.contractId} className="text-sm border border-slate-100 rounded-lg p-3">
                        <div className="flex items-start justify-between gap-2">
                          <p className="font-medium text-slate-800">{c.vendor}</p>
                          <span className="font-semibold text-slate-700 tabular-nums flex-shrink-0">{fmtMoney(c.value)}</span>
                        </div>
                        <p className="text-slate-500 text-xs mt-1">{c.description}</p>
                        <p className="text-slate-400 text-xs">Contract {c.contractId} · Awarded {fmtDate(c.awardDate)}</p>
                        {c.sourceUrl && <ExtLink href={c.sourceUrl} cls="text-xs mt-1 block">Source ↗</ExtLink>}
                      </div>
                    ))}
                  </div>
                ) : <p className="text-sm text-slate-400 italic">No contracts linked.</p>}
              </AccordionBody>
            </Accordion>
          </div>

          <div ref={refs.lawChanges}>
            <Accordion label={accordionLabel("Law / bylaw changes", s.lawChanges, item.lawChanges?.length || undefined)}>
              <AccordionBody state={s.lawChanges} notTracedLabel="Bylaw change information">
                {item.lawChanges?.length
                  ? <div className="space-y-2">{item.lawChanges.map((l, i) => (
                      <div key={i} className="text-sm border border-slate-100 rounded-lg p-3 text-slate-700">{l.description}</div>
                    ))}</div>
                  : <p className="text-sm text-slate-400 italic">No bylaw changes linked.</p>}
              </AccordionBody>
            </Accordion>
          </div>

          <Accordion label={`Community suggestions (${item.selectedSuggestions?.length ?? 0})`}>
            {item.selectedSuggestions?.length ? (
              <div className="space-y-2">
                {item.selectedSuggestions.map(s => (
                  <div key={s.suggestionId} className="text-sm border border-slate-100 rounded-lg p-3">
                    <p className="text-slate-700 italic">"{s.text}"</p>
                    <p className="text-slate-400 text-xs mt-1.5">— {s.author} &nbsp;<Chip color={s.status === "Incorporated" ? "green" : "slate"}>{s.status}</Chip></p>
                  </div>
                ))}
              </div>
            ) : <p className="text-sm text-slate-400 italic">No community suggestions on file.</p>}
          </Accordion>

          <Accordion label={`Meetings discussed in (${item.meetingDiscussedIn?.length ?? 0})`}>
            {item.meetingDiscussedIn?.length ? (
              <div className="space-y-2">
                {item.meetingDiscussedIn.map(m => (
                  <div key={m.meetingId} className="flex items-center justify-between text-sm">
                    <span className="text-slate-700">{m.committee} · {fmtDate(m.date)}</span>
                    <ExtLink href={m.agendaUrl} cls="text-xs flex-shrink-0 ml-3">Agenda ↗</ExtLink>
                  </div>
                ))}
              </div>
            ) : <p className="text-sm text-slate-400 italic">No meeting records linked.</p>}
          </Accordion>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       PROVENANCE FOOTER
    ══════════════════════════════════════════════════════════════════════ */

    function ProvenanceFooter({ item }) {
      if (!item.provenance?.length) return null;
      return (
        <footer className="my-10 pt-6 border-t border-slate-200">
          <p className="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-4">Sources &amp; provenance</p>
          <div className="space-y-2.5">
            {item.provenance.map((p, i) => (
              <div key={i} className="flex gap-4 text-sm">
                <span className="text-slate-400 text-xs uppercase tracking-wide min-w-[120px] pt-0.5">{p.label}</span>
                {p.url
                  ? <ExtLink href={p.url}>{p.text || p.url}</ExtLink>
                  : <span className="text-slate-600">{p.author ?? ""}{p.author && p.date ? " · " : ""}{p.date ?? ""}</span>}
              </div>
            ))}
          </div>
        </footer>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       PARTICIPATION SLOT (reserved)
    ══════════════════════════════════════════════════════════════════════ */

    function ParticipationSlot() {
      return (
        <div className="my-8 p-3 border border-dashed border-slate-200 rounded-lg text-center">
          <p className="text-xs text-slate-400 italic">Community reactions — coming soon</p>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       PROTOTYPE SELECTOR (remove when routing is wired)
    ══════════════════════════════════════════════════════════════════════ */

    function ItemSelector({ items, selected, onChange }) {
      return (
        <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 flex flex-wrap gap-2 items-center">
          <span className="text-xs font-semibold text-amber-700 uppercase tracking-wide mr-1">Prototype — toggle item:</span>
          {items.map(it => (
            <button key={it.id} onClick={() => onChange(it.id)}
                    className={`text-xs px-3 py-1 rounded border transition-all cursor-pointer ${
                      selected === it.id
                        ? "bg-amber-700 text-white border-amber-700"
                        : "bg-white text-amber-700 border-amber-400 hover:bg-amber-100"
                    }`}>
              <span className="font-semibold mr-1">{it.badge}:</span>{it.label}
            </button>
          ))}
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       ROOT
    ══════════════════════════════════════════════════════════════════════ */

    function ItemRecord() {
      const [selectedId, setSelectedId] = useState("item-a");
      const item = getItem(selectedId);

      const moneyRef       = useRef(null);
      const decisionRef    = useRef(null);
      const outcomeRef     = useRef(null);
      const projectsRef    = useRef(null);
      const procurementRef = useRef(null);
      const lawChangesRef  = useRef(null);

      const refMap = {
        money: moneyRef, decision: decisionRef, outcome: outcomeRef,
        projects: projectsRef, procurement: procurementRef, lawChanges: lawChangesRef,
      };

      function scrollTo(key) {
        refMap[key]?.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      if (!item) return <div className="p-10 text-slate-400 text-sm">Item not found.</div>;

      return (
        <div className="min-h-screen bg-slate-50">
          <ItemSelector items={ITEM_LIST} selected={selectedId} onChange={setSelectedId} />
          <main className="max-w-2xl mx-auto px-5 py-10">

            <IdentityHeader item={item} />
            <PlainSummary item={item} />
            <ChainRibbon item={item} onNav={scrollTo} />

            <ChainSection sectionRef={decisionRef} state={item._chainStates.decision} label="Decision">
              <DecisionSection item={item} />
            </ChainSection>

            <ChainSection sectionRef={moneyRef} state={item._chainStates.money} label="Money">
              <MoneySection item={item} />
            </ChainSection>

            <ChainSection sectionRef={outcomeRef} state={item._chainStates.outcome} label="Outcome"
                          pendingContext={item.pendingContext}>
              <OutcomeSection item={item} />
            </ChainSection>

            <ProgressiveDisclosure item={item}
              refs={{ projects: projectsRef, procurement: procurementRef, lawChanges: lawChangesRef }} />

            <ProvenanceFooter item={item} />
            <ParticipationSlot />
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ItemRecord />);
  </script>
</body>
</html>
